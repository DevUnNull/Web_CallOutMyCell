name = "callout-shop"
main = "src/index.ts"
compatibility_date = "2025-09-01"

[vars]
SITE_URL = "https://devunnull.github.io/Web_CallOutMyCell/"
SITE_ORIGIN = "https://devunnull.github.io"
PRICE = "59000"

[[d1_databases]]
binding = "DB"
database_name = "callout-orders"
# Filled in by `wrangler d1 create callout-orders` (see README). Any value works for local dev.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "GAME"
bucket_name = "callout-game"
